<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big C Audiovisual</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
}

.logo {
    width: 120px;
    margin-bottom: 20px;
    opacity: 0.9;
}

h1 {
    font-size: 70px;
    letter-spacing: 12px;
    margin: 0;
    transition: 0.3s;
}

h1:hover {
    letter-spacing: 18px;
}

.subtitle {
    margin-top: 10px;
    font-size: 16px;
    opacity: 0.6;
}

.player {
    margin-top: 40px;
}

.links {
    margin-top: 30px;
}

.links a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-size: 14px;
    opacity: 0.5;
    transition: 0.3s;
}

.links a:hover {
    opacity: 1;
}

.footer {
    position: absolute;
    bottom: 20px;
    font-size: 12px;
    opacity: 0.3;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <img src="logo.png" class="logo">

    <!-- TITULO -->
    <h1>BIG C</h1>
    <div class="subtitle">Audiovisual</div>

    <!-- SPOTIFY -->
    <div class="player">
        <iframe style="border-radius:12px"
        src="https://open.spotify.com/embed/artist/XXXXXXXX"
        width="300"
        height="380"
        frameBorder="0"
        allowfullscreen=""
        loading="lazy"></iframe>
    </div>

    <!-- LINKS -->
    <div class="links">
        <a href="#">Spotify</a>
        <a href="#">YouTube</a>
        <a href="#">Instagram</a>
    </div>

</div>

<div class="footer">
    © Big C Audiovisual
</div>

</body>
</html>
