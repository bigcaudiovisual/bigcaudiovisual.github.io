<!DOCTYPE html>
<html>
<head>
    <title>Big C Audiovisual</title>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 80px;
            letter-spacing: 10px;
            margin: 0;
        }

        p {
            margin-top: 20px;
            font-size: 18px;
            opacity: 0.7;
        }

        .links {
            margin-top: 40px;
        }

        a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            opacity: 0.6;
            transition: 0.3s;
        }

        a:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>BIG C</h1>
        <p>Audiovisual</p>

        <div class="links">
            <a href="#">Spotify</a>
            <a href="#">YouTube</a>
            <a href="#">Instagram</a>
        </div>
    </div>

</body>
</html>
